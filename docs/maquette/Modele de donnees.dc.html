document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

les de messages) et la persistance des avis de loyer et des relances. Les statuts de location, de garage, d'échéance et de locataire sont calculés et ne sont pas stockés. Les types sont indicatifs (SQL standard).<\u002Fp>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:700\">\n      <span style=\"padding:4px 10px;border-radius:6px;background:#344767;color:#fff\">PK clé primaire<\u002Fspan>\n      <span style=\"padding:4px 10px;border-radius:6px;background:#fff;color:#cb0c9f;border:1px solid #cb0c9f\">FK clé étrangère<\u002Fspan>\n      <span style=\"padding:4px 10px;border-radius:6px;background:#fff;color:#344767;border:1px solid #D2D6DA\">NOT NULL par défaut · « NULL » = facultatif<\u002Fspan>\n      <span style=\"padding:4px 10px;border-radius:6px;background:#0F8A2A;color:#fff\">Nouveau : table ajoutée en v2<\u002Fspan>\n      <span style=\"padding:4px 10px;border-radius:6px;background:#fff0d6;color:#344767;border:1px solid #f0c987\">Modifié : colonnes ajoutées ou changées en v2<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display:flex;flex-direction:column;gap:12px\">\n    <h2 style=\"margin:0;font-size:20px;color:#344767\">1. Diagramme entités-relations<\u002Fh2>\n    <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);padding:24px;overflow:auto\">\n      <div style=\"position:relative;width:{{ dW }}px;height:{{ dH }}px;margin:0 auto\">\n        <svg width=\"{{ dW }}\" height=\"{{ dH }}\" style=\"position:absolute;left:0;top:0\">\n          <sc-for list=\"{{ lines }}\" as=\"l\" hint-placeholder-count=\"12\"><path d=\"{{ l.d }}\" fill=\"none\" stroke=\"#8392AB\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsc-for>\n          <sc-for list=\"{{ lineLabels }}\" as=\"t\" hint-placeholder-count=\"24\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.fill }}\" font-size=\"11\" font-weight=\"{{ t.fw }}\" font-family=\"Open Sans, sans-serif\">{{ t.t }}<\u002Ftext><\u002Fsc-for>\n        <\u002Fsvg>\n        <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"15\">\n          <div style=\"position:absolute;left:{{ c.x }}px;top:{{ c.y }}px;width:{{ c.w }}px;height:{{ c.h }}px;box-sizing:border-box;background:#fff;border:1px solid #D2D6DA;border-radius:10px;overflow:hidden;box-shadow:0 3px 8px rgba(52,71,103,.08)\">\n            <div style=\"height:34px;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;background:{{ c.bg }};font-weight:700;font-size:13px;color:#344767;letter-spacing:.02em\">{{ c.name }}<\u002Fdiv>\n            <div style=\"padding:4px 0\">\n              <sc-for list=\"{{ c.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"height:22px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:#344767\">\n                  <span style=\"width:22px;flex:none;text-align:center;font-size:10px;font-weight:700;color:{{ r.kFg }}\">{{ r.k }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,monospace;font-weight:{{ r.fw }}\">{{ r.n }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#67748E;white-space:nowrap\">{{ r.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:16px;font-size:12px;text-align:center;text-wrap:pretty\">Cardinalités UML : « 1 » côté table parente, « 0..N » côté table enfant, « 0..1 » pour une clé étrangère facultative. Les clés <b>utilisateur_id<\u002Fb> de JOURNAL_AUDIT, AVIS_LOYER et RELANCE référencent UTILISATEUR ; elles ne sont pas tracées pour garder le schéma lisible (voir section 3). DROIT_PROFIL, DROIT_APPAREIL et PARAMETRE n'ont aucune clé étrangère.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:16px\">\n    <h2 style=\"margin:0;font-size:20px;color:#344767\">2. Dictionnaire des tables<\u002Fh2>\n    <sc-for list=\"{{ entities }}\" as=\"e\" hint-placeholder-count=\"15\">\n      <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);overflow:hidden\">\n        <div style=\"padding:16px 24px;background:{{ e.bg }};display:flex;flex-direction:column;gap:2px\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <div style=\"font-size:16px;font-weight:700;color:#344767;font-family:ui-monospace,Menlo,monospace\">{{ e.name }}<\u002Fdiv>\n            <sc-if value=\"{{ e.hasTag }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;background:{{ e.tagBg }};color:{{ e.tagFg }}\">{{ e.tag }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"color:#344767;text-wrap:pretty\">{{ e.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"overflow:auto\"><sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n          <sc-raw-thead><sc-raw-tr style=\"text-align:left;font-size:11px;text-transform:uppercase;opacity:.75\"><sc-raw-th style=\"padding:10px 12px 10px 24px;white-space:nowrap\">Colonne<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;white-space:nowrap\">Type<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;white-space:nowrap\">Clé<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;white-space:nowrap\">Null<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 24px 10px 12px\">Contrainte / règle<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody><sc-for list=\"{{ e.cols }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <sc-raw-tr style=\"border-top:1px solid #e9ecef;vertical-align:top\"><sc-raw-td style=\"padding:10px 12px 10px 24px;font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#344767;white-space:nowrap\">{{ c.n }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;color:#344767\">{{ c.t }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px\"><span style=\"font-size:11px;font-weight:700;color:{{ c.kFg }}\">{{ c.k }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;white-space:nowrap;color:{{ c.nFg }}\">{{ c.nn }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 24px 10px 12px;min-width:280px;text-wrap:pretty\">{{ c.r }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-for><\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:12px\">\n    <h2 style=\"margin:0;font-size:20px;color:#344767\">3. Relations<\u002Fh2>\n    <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);overflow:auto\"><sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n      <sc-raw-thead><sc-raw-tr style=\"text-align:left;font-size:11px;text-transform:uppercase;opacity:.75\"><sc-raw-th style=\"padding:12px 12px 12px 24px\">Parent<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Enfant<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Clé étrangère<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Cardinalité<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Suppression<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px 24px 12px 12px\">Règle<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ rels }}\" as=\"r\" hint-placeholder-count=\"15\">\n        <sc-raw-tr style=\"border-top:1px solid #e9ecef;vertical-align:top\"><sc-raw-td style=\"padding:10px 12px 10px 24px;font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#344767\">{{ r.p }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#344767\">{{ r.c }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap\">{{ r.fk }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;white-space:nowrap\">{{ r.card }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;white-space:nowrap;font-weight:700;color:#344767\">{{ r.del }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 24px 10px 12px;min-width:260px;text-wrap:pretty\">{{ r.rule }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <h2 style=\"margin:0;font-size:20px;color:#344767\">4. Valeurs énumérées<\u002Fh2>\n      <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);padding:8px 24px\">\n        <sc-for list=\"{{ enums }}\" as=\"e\" hint-placeholder-count=\"14\"><div style=\"padding:12px 0;border-top:1px solid #e9ecef;display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#344767;font-size:13px\">{{ e.n }}<\u002Fdiv><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ e.v }}\" as=\"v\" hint-placeholder-count=\"3\"><span style=\"padding:2px 8px;border-radius:6px;background:#F8F9FA;border:1px solid #e9ecef;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#344767\">{{ v }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <h2 style=\"margin:0;font-size:20px;color:#344767\">5. Unicités et contrôles SQL<\u002Fh2>\n      <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);padding:8px 24px\">\n        <sc-for list=\"{{ sqlRules }}\" as=\"r\" hint-placeholder-count=\"20\"><div style=\"padding:10px 0;border-top:1px solid #e9ecef;display:flex;gap:12px\"><span style=\"flex:none;min-width:64px;font-size:11px;font-weight:700;text-transform:uppercase;color:#cb0c9f;padding-top:2px\">{{ r.k }}<\u002Fspan><span style=\"min-width:0;text-wrap:pretty\"><b style=\"color:#344767;font-family:ui-monospace,Menlo,monospace;font-size:12px\">{{ r.t }}<\u002Fb><br>{{ r.d }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:12px\">\n    <h2 style=\"margin:0;font-size:20px;color:#344767\">6. Données calculées (non stockées)<\u002Fh2>\n    <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);overflow:auto\"><sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n      <sc-raw-thead><sc-raw-tr style=\"text-align:left;font-size:11px;text-transform:uppercase;opacity:.75\"><sc-raw-th style=\"padding:12px 12px 12px 24px\">Donnée<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Valeurs<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px 24px 12px 12px\">Calcul<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ derived }}\" as=\"d\" hint-placeholder-count=\"14\">\n        <sc-raw-tr style=\"border-top:1px solid #e9ecef;vertical-align:top\"><sc-raw-td style=\"padding:10px 12px 10px 24px;font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#344767;white-space:nowrap\">{{ d.n }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;color:#344767;min-width:180px\">{{ d.v }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 24px 10px 12px;min-width:320px;text-wrap:pretty\">{{ d.c }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:12px\">\n    <h2 style=\"margin:0;font-size:20px;color:#344767\">7. Contrôles applicatifs (hors contrainte SQL)<\u002Fh2>\n    <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);padding:8px 24px\">\n      <sc-for list=\"{{ appRules }}\" as=\"r\" hint-placeholder-count=\"16\"><div style=\"padding:10px 0;border-top:1px solid #e9ecef;display:flex;gap:12px\"><span style=\"flex:none;min-width:84px;font-size:11px;font-weight:700;text-transform:uppercase;color:#cb0c9f;padding-top:2px\">{{ r.k }}<\u002Fspan><span style=\"min-width:0;text-wrap:pretty\">{{ r.d }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:12px\">\n    <h2 style=\"margin:0;font-size:20px;color:#344767\">8. Écrans de Configuration et tables associées<\u002Fh2>\n    <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);overflow:auto\"><sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n      <sc-raw-thead><sc-raw-tr style=\"text-align:left;font-size:11px;text-transform:uppercase;opacity:.75\"><sc-raw-th style=\"padding:12px 12px 12px 24px\">Écran (code droit)<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Tables<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px 24px 12px 12px\">Données portées<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ screens }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <sc-raw-tr style=\"border-top:1px solid #e9ecef;vertical-align:top\"><sc-raw-td style=\"padding:10px 12px 10px 24px;color:#344767;font-weight:700;white-space:nowrap\">{{ s.n }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#344767;min-width:200px\">{{ s.t }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 24px 10px 12px;min-width:320px;text-wrap:pretty\">{{ s.d }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:12px\">\n    <h2 style=\"margin:0;font-size:20px;color:#344767\">9. Lignes de PARAMETRE livrées avec l'application<\u002Fh2>\n    <p style=\"margin:0;max-width:880px;text-wrap:pretty\">Données de départ de la table PARAMETRE. Les lignes ne se créent ni ne se suppriment depuis l'écran. Les bornes des entiers et les choix des listes sont contrôlés par l'application. La nature (metier, application, systeme) suit RG-PAR-01.<\u002Fp>\n    <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);overflow:auto\"><sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n      <sc-raw-thead><sc-raw-tr style=\"text-align:left;font-size:11px;text-transform:uppercase;opacity:.75\"><sc-raw-th style=\"padding:12px 12px 12px 24px\">Catégorie<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Clé<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Défaut<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px\">Obligatoire<\u002Fsc-raw-th><sc-raw-th style=\"padding:12px 24px 12px 12px\">Bornes / choix<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ params }}\" as=\"p\" hint-placeholder-count=\"26\">\n        <sc-raw-tr style=\"border-top:1px solid #e9ecef;vertical-align:top\"><sc-raw-td style=\"padding:8px 12px 8px 24px;color:#344767;white-space:nowrap\">{{ p.cat }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#344767;white-space:nowrap\">{{ p.cle }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap\">{{ p.type }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#344767\">{{ p.def }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 12px;white-space:nowrap\">{{ p.req }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 24px 8px 12px\">{{ p.lim }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:12px\">\n    <h2 style=\"margin:0;font-size:20px;color:#344767\">10. Évolutions par rapport au MCD précédent (9 tables)<\u002Fh2>\n    <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 27px rgba(0,0,0,.05);padding:8px 24px\">\n      <sc-for list=\"{{ changes }}\" as=\"r\" hint-placeholder-count=\"10\"><div style=\"padding:10px 0;border-top:1px solid #e9ecef;display:flex;gap:12px\"><span style=\"flex:none;min-width:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:#344767;padding-top:1px\">{{ r.k }}<\u002Fspan><span style=\"min-width:0;text-wrap:pretty\">{{ r.d }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const c = (n, t, k, nn, r) => ({ n, t, k, nn: nn ? 'NOT NULL' : 'NULL', r, kFg: k === 'PK' ? '#344767' : '#cb0c9f', nFg: nn ? '#344767' : '#67748E', fw: k ? 700 : 400 });\n    const PK = (r) => c('id', 'INTEGER', 'PK', true, r || 'Identifiant auto-incrémenté.');\n    const B = { blue: '#e3ecff', pink: '#fde4f4', purple: '#efe6ff', green: '#e0f4e6', amber: '#fff0d6', gray: '#eceff3', teal: '#d9f3f7' };\n    const NEW = { tag: 'Nouveau', tagBg: '#0F8A2A', tagFg: '#ffffff' }, MOD = { tag: 'Modifié', tagBg: '#fff0d6', tagFg: '#344767' };\n    const E = [\n      { key: 'LOCATAIRE', bg: B.pink, x: 0, y: 0, desc: `Personne louant ou ayant loué un ou plusieurs garages. Un locataire peut avoir plusieurs locations, sur des garages différents.`, cols: [PK(),\n        c('civilite', 'VARCHAR(4)', '', false, 'Valeurs : M. ou Mme.'),\n        c('nom', 'VARCHAR(100)', '', true, 'Obligatoire.'),\n        c('prenom', 'VARCHAR(100)', '', true, `Obligatoire. Le couple nom + prénom déclenche une alerte de doublon non bloquante, sans contrainte d'unicité.`),\n        c('rue', 'VARCHAR(150)', '', true, 'Adresse : rue.'),\n        c('numero_rue', 'VARCHAR(10)', '', true, 'Adresse : numéro.'),\n        c('code_postal', 'VARCHAR(10)', '', true, 'Adresse : code postal.'),\n        c('localite', 'VARCHAR(100)', '', true, 'Adresse : localité.'),\n        c('tel1', 'VARCHAR(30)', '', true, 'Téléphone principal.'),\n        c('tel2', 'VARCHAR(30)', '', false, 'Téléphone secondaire.'),\n        c('email', 'VARCHAR(255)', '', false, `Format e-mail valide s'il est renseigné. Sans e-mail, le locataire est contacté par un autre moyen (avis, relances).`)] },\n      { key: 'LOCATION', bg: B.purple, x: 320, y: 0, desc: `Période pendant laquelle un locataire occupe un garage. Le statut n'est pas stocké (voir section 6).`, cols: [PK(),\n        c('garage_id', 'INTEGER', 'FK', true, 'Garage loué.'),\n        c('locataire_id', 'INTEGER', 'FK', true, 'Locataire.'),\n        c('date_debut', 'DATE', '', true, 'Peut être passée ou future (location « à venir »). Un loyer doit exister pour le garage à cette date.'),\n        c('date_fin', 'DATE', '', false, `NULL = sans échéance. Sinon dernier jour d'un mois et ≥ date_debut, avec une durée au moins égale au paramètre location_duree_min. Une fin passée ou du jour termine la location.`),\n        c('nb_cles_remises', 'SMALLINT', '', true, '≥ 0 et ≤ garage.nb_cles_total − garage.nb_cles_reserve.')] },\n      { key: 'GARAGE', bg: B.blue, x: 640, y: 0, desc: 'Garage louable. Maximum 20 garages (contrôle applicatif).', cols: [PK(),\n        c('numero', 'VARCHAR(10)', '', true, `Unique. Saisi en majuscules (ex. G01, préfixe et nombre de chiffres issus des paramètres), non modifiable après création.`),\n        c('adresse', 'VARCHAR(200)', '', false, 'Présente dans les données de démonstration et utilisée par la recherche, mais ni affichée ni saisie dans la maquette. Vide pour les garages créés.'),\n        c('nb_cles_total', 'SMALLINT', '', true, '≥ 0 dans la maquette (> 0 dans les règles métier initiales : à trancher).'),\n        c('nb_cles_reserve', 'SMALLINT', '', true, '≥ 0 et ≤ nb_cles_total. Clés gardées en réserve, jamais remises. Clés disponibles = total − réserve.'),\n        c('statut', 'VARCHAR(15)', '', true, `libre (défaut) ou indisponible. « Loué » n'est jamais stocké : il est déduit de la location active.`)] },\n      { key: 'LOYER_GARAGE', bg: B.blue, x: 640, y: 212, desc: `Historique des loyers d'un garage. Deux périodes d'un même garage ne se chevauchent jamais.`, cols: [PK(),\n        c('garage_id', 'INTEGER', 'FK', true, 'Garage concerné. Au moins un loyer à la création du garage.'),\n        c('montant', 'DECIMAL(8,2)', '', true, '> 0. Montant mensuel en euros.'),\n        c('date_debut', 'DATE', '', true, 'Strictement postérieure au début du loyer précédent du même garage.'),\n        c('date_fin', 'DATE', '', false, 'NULL = loyer courant. Renseignée automatiquement à la veille de date_debut du loyer suivant, jamais saisie.')] },\n      { key: 'ECHEANCE', bg: B.green, x: 320, y: 234, desc: `Loyer dû pour une location et un mois. Le statut (à payer, partiel, payé) est déduit des versements.`, cols: [PK(),\n        c('location_id', 'INTEGER', 'FK', true, 'Location concernée.'),\n        c('periode', 'DATE', '', true, 'Premier jour du mois concerné. Unique avec location_id.'),\n        c('montant_du', 'DECIMAL(8,2)', '', true, `> 0. Loyer en vigueur du garage pour cette période, figé à la création de l'échéance.`)] },\n      { key: 'VERSEMENT', bg: B.green, x: 320, y: 424, desc: 'Encaissement imputé à une échéance. Plusieurs versements peuvent solder une échéance (paiement partiel).', cols: [PK(),\n        c('echeance_id', 'INTEGER', 'FK', true, 'Échéance payée.'),\n        c('montant', 'DECIMAL(8,2)', '', true, `> 0. Le cumul des versements d'une échéance ne dépasse pas montant_du.`),\n        c('mode_paiement', 'VARCHAR(10)', '', true, 'virement ou especes.'),\n        c('date_paiement', 'DATE', '', true, 'Date de réception, proposée à la date du jour.')] },\n      { key: 'REMARQUE', bg: B.amber, x: 960, y: 0, desc: `Remarque ou interaction rattachée à un locataire ou à un garage, jamais à une location. Créée aussi automatiquement par chaque avis, relance ou message libre (type information).`, cols: [PK(),\n        c('locataire_id', 'INTEGER', 'FK', false, 'Renseigné si la remarque concerne un locataire.'),\n        c('garage_id', 'INTEGER', 'FK', false, 'Renseigné si la remarque concerne un garage. Exactement un des deux champs est renseigné.'),\n        c('date_creation', 'TIMESTAMP', '', true, 'Horodatée par le système, non modifiable.'),\n        c('type', 'VARCHAR(12)', '', true, 'information, probleme ou autre.'),\n        c('texte', 'TEXT', '', true, 'Texte enrichi (HTML : gras, italique, souligné, listes, liens), assaini avant stockage. Non vide.'),\n        c('resolu', 'BOOLEAN', '', false, 'NULL si type ≠ probleme. Sinon false à la création, true une fois résolu.'),\n        c('date_resolution', 'DATE', '', false, 'Obligatoire quand resolu = true, NULL sinon. Effacée à la réouverture.')] },\n      { key: 'UTILISATEUR', bg: B.gray, x: 0, y: 344, ...MOD, desc: `Compte d'accès à l'application (écran Configuration > Utilisateurs). Quatre profils. Un compte n'est jamais supprimé : il est désactivé. Il existe toujours au moins un admin actif.`, cols: [PK(),\n        c('login', 'VARCHAR(50)', '', true, 'Unique. 3 à 30 caractères : minuscules, chiffres, point, tiret, tiret bas. Enregistré en minuscules, non modifiable après création.'),\n        c('email', 'VARCHAR(255)', '', true, 'Unique, comparaison insensible à la casse. Enregistré en minuscules. Format e-mail valide.'),\n        c('nom', 'VARCHAR(100)', '', true, 'Ajouté en v2. Obligatoire.'),\n        c('prenom', 'VARCHAR(100)', '', true, 'Ajouté en v2. Obligatoire.'),\n        c('mot_de_passe_hash', 'VARCHAR(255)', '', true, 'BCrypt, jamais en clair. Longueur minimale imposée au choix : paramètre mdp_min. Journalisé comme « modifié » sans valeur.'),\n        c('mot_de_passe_temporaire', 'BOOLEAN', '', true, 'Ajouté en v2. Défaut false. true après création du compte ou réinitialisation : changement obligatoire à la connexion suivante.'),\n        c('role', 'VARCHAR(20)', '', true, 'Modifié en v2 : admin, gestionnaire, locataire ou consultant (remplace lecture_seule). Un utilisateur ne change pas son propre profil.'),\n        c('locataire_id', 'INTEGER', 'FK', false, 'Ajouté en v2. Fiche locataire du compte : obligatoire et unique si role = locataire, NULL sinon. Sert à limiter les données visibles du profil Locataire.'),\n        c('actif', 'BOOLEAN', '', true, 'Défaut true. Compte désactivé : connexion refusée, données conservées, réactivable. Impossible de désactiver son propre compte ou le dernier admin actif.'),\n        c('derniere_connexion', 'TIMESTAMP', '', false, 'Ajouté en v2. NULL = jamais connecté. Mise à jour à chaque connexion réussie.'),\n        c('date_creation', 'TIMESTAMP', '', true, 'Ajouté en v2. Horodatée par le système.')] },\n      { key: 'JETON_MOT_DE_PASSE', bg: B.teal, x: 0, y: 710, ...NEW, desc: `Jeton de réinitialisation envoyé par e-mail (écrans « Mot de passe oublié » et « Nouveau mot de passe »). Usage unique, durée de vie limitée.`, cols: [PK(),\n        c('utilisateur_id', 'INTEGER', 'FK', true, 'Compte concerné.'),\n        c('jeton_hash', 'VARCHAR(255)', '', true, 'Unique. Jeton aléatoire stocké haché, jamais en clair.'),\n        c('expire_le', 'TIMESTAMP', '', true, 'Durée de validité à fixer (proposition : 1 heure).'),\n        c('utilise', 'BOOLEAN', '', true, 'Défaut false. Passe à true à la première utilisation ; un jeton utilisé ou expiré est refusé.')] },\n      { key: 'RELANCE', bg: B.green, x: 320, y: 636, ...NEW, desc: `Relance d'un impayé (écran Envoi de messages > Relances d'impayés). Une ligne par échéance et par reste dû : si un versement modifie le reste dû, une nouvelle relance est à faire.`, cols: [PK(),\n        c('echeance_id', 'INTEGER', 'FK', true, 'Échéance relancée.'),\n        c('reste_du', 'DECIMAL(8,2)', '', true, '> 0. Reste dû au moment de la relance, figé.'),\n        c('cas', 'VARCHAR(8)', '', true, 'total (aucun versement) ou partiel (versements inférieurs au montant dû). Détermine le modèle de message.'),\n        c('moyen', 'VARCHAR(12)', '', true, 'email, telephone, courrier ou oral.'),\n        c('date_relance', 'DATE', '', true, 'Date d\\'envoi ou de contact (date du jour par défaut).'),\n        c('objet', 'VARCHAR(255)', '', false, 'Objet expédié, renseigné si moyen = email.'),\n        c('texte', 'TEXT', '', false, `Corps HTML tel qu'expédié, renseigné si moyen = email (aperçu d'une relance envoyée).`),\n        c('utilisateur_id', 'INTEGER', 'FK', true, 'Utilisateur ayant relancé.')] },\n      { key: 'AVIS_LOYER', bg: B.blue, x: 640, y: 424, ...NEW, desc: `Avis de changement de loyer communiqué au locataire (écran Envoi de messages > Avis de loyer). Un avis est identifié par location + loyer + nouveau montant + date d'effet : si le loyer à venir est modifié après l'envoi, un nouvel avis est à communiquer.`, cols: [PK(),\n        c('location_id', 'INTEGER', 'FK', true, 'Location active concernée (donne le locataire et le garage).'),\n        c('loyer_garage_id', 'INTEGER', 'FK', true, 'Loyer à venir annoncé.'),\n        c('ancien_montant', 'DECIMAL(8,2)', '', true, '> 0. Loyer précédent, figé à la communication.'),\n        c('nouveau_montant', 'DECIMAL(8,2)', '', true, '> 0. Loyer annoncé, figé à la communication.'),\n        c('date_effet', 'DATE', '', true, 'Date de début du loyer annoncé.'),\n        c('moyen', 'VARCHAR(12)', '', true, 'email, telephone, courrier ou oral.'),\n        c('date_envoi', 'DATE', '', true, `Date d'envoi ou de contact (date du jour par défaut).`),\n        c('objet', 'VARCHAR(255)', '', false, 'Objet expédié, renseigné si moyen = email.'),\n        c('texte', 'TEXT', '', false, `Corps HTML tel qu'expédié, renseigné si moyen = email (aperçu d'un avis envoyé).`),\n        c('utilisateur_id', 'INTEGER', 'FK', true, 'Utilisateur ayant communiqué l\\'avis.')] },\n      { key: 'PARAMETRE', bg: B.amber, x: 960, y: 258, ...MOD, desc: `Paramètre de configuration de l'application (écrans Configuration > Paramètres et Modèles de messages), regroupé par catégorie. Table clé / valeur sans relation avec les autres tables. Porte aussi les modèles de messages, la signature et l'état de maintenance.`, cols: [PK(),\n        c('nature', 'VARCHAR(12)', '', true, `Modifié en v2 : metier (règles de gestion, données de l'activité), application (messagerie, affichage, sécurité) ou systeme (valeurs techniques non affichées dans l'écran Paramètres, ex. maintenance_active).`),\n        c('categorie', 'VARCHAR(40)', '', true, `Catégorie d'affichage dans l'écran Paramètres (ex. expediteur, organisation, affichage, securite, modeles_messages).`),\n        c('cle', 'VARCHAR(60)', '', true, `Unique. Identifiant technique lu par l'application (ex. expediteur_nom). Liste en section 9.`),\n        c('libelle', 'VARCHAR(100)', '', true, `Intitulé affiché à l'utilisateur.`),\n        c('type', 'VARCHAR(12)', '', true, `texte, email, entier, liste ou texte_riche. Détermine le champ de saisie et le contrôle.`),\n        c('valeur', 'TEXT', '', false, `Valeur sérialisée en texte. NULL ou vide si un paramètre facultatif n'est pas renseigné.`),\n        c('obligatoire', 'BOOLEAN', '', true, 'Défaut false. Si true, la valeur ne peut pas être vide.'),\n        c('ordre', 'SMALLINT', '', true, `Rang d'affichage dans la catégorie.`),\n        c('date_modification', 'TIMESTAMP', '', true, 'Horodatée par le système à chaque enregistrement.')] },\n      { key: 'DROIT_PROFIL', bg: B.teal, x: 960, y: 560, ...NEW, desc: `Droits par profil et par écran (écran Configuration > Droits d'accès, onglets « Accès aux écrans » et « Actions autorisées »). Lue par le back à chaque requête, jamais copiée dans le jeton.`, cols: [PK(),\n        c('profil', 'VARCHAR(20)', '', true, 'admin, gestionnaire, locataire ou consultant.'),\n        c('ecran', 'VARCHAR(10)', '', true, 'Code écran : dash, sta, gar, loy, hloc, ten, chr, loc, pai, rem, avi, rel, lib, par, tpl, usr, dro, aud, mnt.'),\n        c('peut_voir', 'BOOLEAN', '', true, 'Défaut false. Accès à l\\'écran.'),\n        c('peut_ajouter', 'BOOLEAN', '', true, 'Défaut false. Suppose peut_voir. N\\'a de sens que si l\\'écran propose l\\'action.'),\n        c('peut_modifier', 'BOOLEAN', '', true, 'Défaut false. Suppose peut_voir. Sans ce droit, les fenêtres s\\'ouvrent en consultation.'),\n        c('peut_supprimer', 'BOOLEAN', '', true, 'Défaut false. Suppose peut_voir. Les conditions métier de suppression restent vérifiées en plus.')] },\n      { key: 'DROIT_APPAREIL', bg: B.teal, x: 960, y: 796, ...NEW, desc: `Écrans disponibles selon l'appareil (Droits d'accès > « Accès selon l'appareil », réservé à l'admin). Réglage de présentation : le back ne détecte pas l'appareil, le front l'applique. Ordinateur : toujours tout autorisé, non stocké.`, cols: [PK(),\n        c('appareil', 'VARCHAR(10)', '', true, 'tablette ou smartphone.'),\n        c('ecran', 'VARCHAR(10)', '', true, 'Mêmes codes que DROIT_PROFIL. L\\'écran dro reste toujours autorisé.'),\n        c('autorise', 'BOOLEAN', '', true, 'Défaut : tablette tous les écrans ; smartphone tous sauf la section Configuration (hors dro).')] },\n      { key: 'JOURNAL_AUDIT', bg: B.gray, x: 640, y: 768, ...NEW, desc: `Journal d'audit (écran Configuration > Journal d'audit, admin seulement). Une ligne par création, modification ou suppression sur 9 tables, écrite par le back dans la même transaction. Insertion seule : aucune modification ni suppression, y compris par un admin.`, cols: [PK(),\n        c('date_heure', 'TIMESTAMP', '', true, `Horodatage de l'opération.`),\n        c('utilisateur_id', 'INTEGER', 'FK', true, 'Utilisateur ayant déclenché l\\'opération, y compris pour les effets automatiques.'),\n        c('action', 'CHAR(1)', '', true, 'C (création), M (modification) ou S (suppression).'),\n        c('concept', 'VARCHAR(20)', '', true, 'Table concernée : GARAGE, LOYER_GARAGE, LOCATAIRE, LOCATION, ECHEANCE, VERSEMENT, REMARQUE, UTILISATEUR ou PARAMETRE.'),\n        c('enregistrement_id', 'INTEGER', '', true, `Identifiant de l'enregistrement concerné. Pas de clé étrangère : l'enregistrement peut avoir été supprimé.`),\n        c('libelle', 'VARCHAR(200)', '', true, `Libellé lisible de l'enregistrement (ex. « Garage G15 »).`),\n        c('valeurs', 'JSON', '', true, `Enregistrement complet après l'opération (avant pour une suppression). Le hash de mot de passe est masqué.`),\n        c('modifications', 'JSON', '', false, 'Champ → { avant, après }. NULL pour une création ou une suppression.'),\n        c('contexte', 'VARCHAR(300)', '', false, 'Explication d\\'un effet automatique (ex. « Clôture automatique de la période précédente : fin = veille du nouveau loyer. »).')] }\n    ];\n    const W = 260, RH = 22, HH = 34, OFF = 44;\n    E.forEach(e => { e.name = e.key; e.h = HH + e.cols.length * RH + 8; e.ay = e.y + OFF; });\n    const M = {}; E.forEach(e => M[e.key] = e);\n    const cards = E.map(e => ({ name: e.name, x: e.x, y: e.ay, w: W, h: e.h, bg: e.bg, rows: e.cols.map(k => ({ k: k.k, n: k.n, t: k.t.replace(/\\(.*\\)/, ''), kFg: k.kFg, fw: k.fw })) }));\n    const R = (e, dy) => [e.x + W, e.ay + dy], L = (e, dy) => [e.x, e.ay + dy], T = (e, dx) => [e.x + dx, e.ay], Bt = (e, dx) => [e.x + dx, e.ay + e.h];\n    const lines = [], lineLabels = [];\n    const lab = (x, y, t, strong) => lineLabels.push({ x, y, t, fill: strong ? '#344767' : '#67748E', fw: strong ? 700 : 400 });\n    const poly = (pts) => lines.push({ d: pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ') });\n    const seg = (a, b) => poly([a, b]);\n    let a = R(M.LOCATAIRE, 17), b = L(M.LOCATION, 17); seg(a, b); lab(a[0] + 6, a[1] - 6, '1', 1); lab(b[0] - 32, b[1] - 6, '0..N');\n    a = L(M.GARAGE, 17); b = R(M.LOCATION, 17); seg(b, a); lab(a[0] - 14, a[1] - 6, '1', 1); lab(b[0] + 6, b[1] - 6, '0..N');\n    a = Bt(M.LOCATION, 130); b = T(M.ECHEANCE, 130); seg(a, b); lab(a[0] + 8, a[1] + 14, '1', 1); lab(b[0] + 8, b[1] - 6, '0..N');\n    a = Bt(M.ECHEANCE, 130); b = T(M.VERSEMENT, 130); seg(a, b); lab(a[0] + 8, a[1] + 14, '1', 1); lab(b[0] + 8, b[1] - 6, '0..N');\n    a = Bt(M.GARAGE, 130); b = T(M.LOYER_GARAGE, 130); seg(a, b); lab(a[0] + 8, a[1] + 14, '1', 1); lab(b[0] + 8, b[1] - 6, '1..N');\n    a = R(M.GARAGE, 17); b = L(M.REMARQUE, 17); seg(a, b); lab(a[0] + 6, a[1] - 6, '0..1', 1); lab(b[0] - 32, b[1] - 6, '0..N');\n    a = T(M.LOCATAIRE, 130); b = T(M.REMARQUE, 130);\n    lines.push({ d: 'M' + a[0] + ' ' + a[1] + ' L' + a[0] + ' 18 L' + b[0] + ' 18 L' + b[0] + ' ' + b[1] });\n    lab(a[0] + 8, a[1] - 6, '0..1', 1); lab(b[0] + 8, b[1] - 6, '0..N'); lab(540, 12, 'une remarque concerne un locataire OU un garage (XOR)');\n    a = Bt(M.LOCATAIRE, 130); b = T(M.UTILISATEUR, 130); seg(a, b); lab(a[0] + 8, a[1] + 14, '0..1', 1); lab(b[0] + 8, b[1] - 6, '0..1');\n    a = Bt(M.UTILISATEUR, 130); b = T(M.JETON_MOT_DE_PASSE, 130); seg(a, b); lab(a[0] + 8, a[1] + 14, '1', 1); lab(b[0] + 8, b[1] - 6, '0..N');\n    a = L(M.ECHEANCE, 60); b = L(M.RELANCE, 17); poly([a, [290, a[1]], [290, b[1]], b]); lab(a[0] - 14, a[1] - 6, '1', 1); lab(b[0] - 27, b[1] - 6, '0..N');\n    a = Bt(M.LOYER_GARAGE, 130); b = T(M.AVIS_LOYER, 130); seg(a, b); lab(a[0] + 8, a[1] + 14, '1', 1); lab(b[0] + 8, b[1] - 6, '0..N');\n    a = R(M.LOCATION, 110); b = L(M.AVIS_LOYER, 40); poly([a, [610, a[1]], [610, b[1]], b]); lab(a[0] + 4, a[1] - 6, '1', 1); lab(b[0] - 27, b[1] - 6, '0..N');\n    const entities = E.map(e => ({ name: e.name, bg: e.bg, desc: e.desc, cols: e.cols, hasTag: !!e.tag, tag: e.tag || '', tagBg: e.tagBg || '', tagFg: e.tagFg || '' }));\n    const rels = [\n      { p: 'GARAGE', c: 'LOYER_GARAGE', fk: 'garage_id', card: '1 — 1..N', del: 'CASCADE', rule: `Le premier loyer est créé avec le garage. La suppression d'un garage (droit gar « supprimer », sans location) supprime son historique de loyers.` },\n      { p: 'GARAGE', c: 'LOCATION', fk: 'garage_id', card: '1 — 0..N', del: 'RESTRICT', rule: 'Un garage ayant un historique de locations ne peut pas être supprimé.' },\n      { p: 'LOCATAIRE', c: 'LOCATION', fk: 'locataire_id', card: '1 — 0..N', del: 'RESTRICT', rule: 'Un locataire ayant eu une location ou un paiement ne peut pas être supprimé.' },\n      { p: 'LOCATION', c: 'ECHEANCE', fk: 'location_id', card: '1 — 0..N', del: 'RESTRICT', rule: 'Une location portant des échéances ne peut être que clôturée.' },\n      { p: 'ECHEANCE', c: 'VERSEMENT', fk: 'echeance_id', card: '1 — 0..N', del: 'RESTRICT', rule: `Les versements s'annulent un par un (droit pai « supprimer », admin par défaut).` },\n      { p: 'LOCATAIRE', c: 'REMARQUE', fk: 'locataire_id', card: '0..1 — 0..N', del: 'CASCADE', rule: `La suppression d'un locataire supprime ses remarques.` },\n      { p: 'GARAGE', c: 'REMARQUE', fk: 'garage_id', card: '0..1 — 0..N', del: 'CASCADE', rule: `La suppression d'un garage supprime ses remarques.` },\n      { p: 'LOCATAIRE', c: 'UTILISATEUR', fk: 'locataire_id', card: '0..1 — 0..1', del: 'RESTRICT', rule: `Nouveau. Un compte de profil Locataire est relié à une seule fiche ; une fiche a au plus un compte. Tant qu'un compte est rattaché, la fiche ne peut pas être supprimée (à confirmer).` },\n      { p: 'UTILISATEUR', c: 'JETON_MOT_DE_PASSE', fk: 'utilisateur_id', card: '1 — 0..N', del: 'CASCADE', rule: 'Nouveau. Les jetons de réinitialisation disparaissent avec le compte.' },\n      { p: 'UTILISATEUR', c: 'JOURNAL_AUDIT', fk: 'utilisateur_id', card: '1 — 0..N', del: 'RESTRICT', rule: `Nouveau. Le journal est conservé : un compte n'est jamais supprimé, seulement désactivé.` },\n      { p: 'LOCATION', c: 'AVIS_LOYER', fk: 'location_id', card: '1 — 0..N', del: 'CASCADE', rule: `Nouveau. Les avis disparaissent avec une location supprimée ; la trace reste dans le journal d'audit (à confirmer).` },\n      { p: 'LOYER_GARAGE', c: 'AVIS_LOYER', fk: 'loyer_garage_id', card: '1 — 0..N', del: 'CASCADE', rule: `Nouveau. La suppression d'un dernier loyer à venir supprime les avis qui l'annoncent (à confirmer).` },\n      { p: 'UTILISATEUR', c: 'AVIS_LOYER', fk: 'utilisateur_id', card: '1 — 0..N', del: 'RESTRICT', rule: 'Nouveau. Utilisateur ayant communiqué l\\'avis.' },\n      { p: 'ECHEANCE', c: 'RELANCE', fk: 'echeance_id', card: '1 — 0..N', del: 'RESTRICT', rule: `Nouveau. Une échéance relancée n'est pas supprimable (comme une échéance portant des versements).` },\n      { p: 'UTILISATEUR', c: 'RELANCE', fk: 'utilisateur_id', card: '1 — 0..N', del: 'RESTRICT', rule: 'Nouveau. Utilisateur ayant relancé.' }\n    ];\n    const enums = [\n      { n: 'UTILISATEUR.role / DROIT_PROFIL.profil', v: ['admin', 'gestionnaire', 'locataire', 'consultant'] },\n      { n: 'DROIT_PROFIL.ecran / DROIT_APPAREIL.ecran', v: ['dash', 'sta', 'gar', 'loy', 'hloc', 'ten', 'chr', 'loc', 'pai', 'rem', 'avi', 'rel', 'lib', 'par', 'tpl', 'usr', 'dro', 'aud', 'mnt'] },\n      { n: 'DROIT_APPAREIL.appareil', v: ['tablette', 'smartphone'] },\n      { n: 'JOURNAL_AUDIT.action', v: ['C', 'M', 'S'] },\n      { n: 'JOURNAL_AUDIT.concept', v: ['GARAGE', 'LOYER_GARAGE', 'LOCATAIRE', 'LOCATION', 'ECHEANCE', 'VERSEMENT', 'REMARQUE', 'UTILISATEUR', 'PARAMETRE'] },\n      { n: 'AVIS_LOYER.moyen / RELANCE.moyen', v: ['email', 'telephone', 'courrier', 'oral'] },\n      { n: 'RELANCE.cas', v: ['total', 'partiel'] },\n      { n: 'PARAMETRE.nature', v: ['metier', 'application', 'systeme'] },\n      { n: 'PARAMETRE.type', v: ['texte', 'email', 'entier', 'liste', 'texte_riche'] },\n      { n: 'GARAGE.statut', v: ['libre', 'indisponible'] },\n      { n: 'LOCATAIRE.civilite', v: ['M.', 'Mme'] },\n      { n: 'VERSEMENT.mode_paiement', v: ['virement', 'especes'] },\n      { n: 'REMARQUE.type', v: ['information', 'probleme', 'autre'] }\n    ];\n    const sqlRules = [\n      { k: 'UNIQUE', t: 'UTILISATEUR (login)', d: 'Un login par compte.' },\n      { k: 'UNIQUE', t: 'UTILISATEUR (email)', d: 'Un e-mail par compte (comparaison insensible à la casse).' },\n      { k: 'UNIQUE', t: 'UTILISATEUR (locataire_id)', d: 'Une fiche locataire a au plus un compte (valeurs NULL multiples admises).' },\n      { k: 'UNIQUE', t: 'JETON_MOT_DE_PASSE (jeton_hash)', d: 'Un jeton ne désigne qu\\'un seul compte.' },\n      { k: 'UNIQUE', t: 'DROIT_PROFIL (profil, ecran)', d: 'Une ligne de droits par profil et par écran.' },\n      { k: 'UNIQUE', t: 'DROIT_APPAREIL (appareil, ecran)', d: 'Une ligne par appareil et par écran.' },\n      { k: 'UNIQUE', t: 'GARAGE (numero)', d: 'Numéro de garage unique.' },\n      { k: 'UNIQUE', t: 'PARAMETRE (cle)', d: 'Une seule ligne par paramètre.' },\n      { k: 'UNIQUE', t: 'ECHEANCE (location_id, periode)', d: 'Une seule échéance par location et par mois.' },\n      { k: 'UNIQUE', t: 'LOYER_GARAGE (garage_id, date_debut)', d: 'Pas deux loyers débutant le même jour pour un garage.' },\n      { k: 'UNIQUE', t: 'AVIS_LOYER (location_id, loyer_garage_id, nouveau_montant, date_effet)', d: 'Un avis par location, loyer annoncé, montant et date d\\'effet.' },\n      { k: 'UNIQUE', t: 'RELANCE (echeance_id, reste_du)', d: 'Une relance par échéance et par reste dû.' },\n      { k: 'CHECK', t: 'UTILISATEUR', d: '(role = \\'locataire\\') = (locataire_id IS NOT NULL).' },\n      { k: 'CHECK', t: 'DROIT_PROFIL', d: 'peut_ajouter, peut_modifier ou peut_supprimer vrai suppose peut_voir vrai.' },\n      { k: 'CHECK', t: 'JOURNAL_AUDIT', d: 'action IN (\\'C\\',\\'M\\',\\'S\\'). Index sur date_heure, utilisateur_id et (concept, enregistrement_id). Aucun UPDATE ni DELETE (droits SQL ou déclencheur).' },\n      { k: 'CHECK', t: 'GARAGE', d: 'nb_cles_total ≥ 0, nb_cles_reserve ≥ 0 et nb_cles_reserve ≤ nb_cles_total.' },\n      { k: 'CHECK', t: 'LOYER_GARAGE', d: 'montant > 0 et date_fin NULL ou ≥ date_debut.' },\n      { k: 'CHECK', t: 'LOCATION', d: 'nb_cles_remises ≥ 0 et date_fin NULL ou ≥ date_debut.' },\n      { k: 'CHECK', t: 'ECHEANCE / VERSEMENT', d: 'montant_du > 0 et montant > 0.' },\n      { k: 'CHECK', t: 'AVIS_LOYER / RELANCE', d: 'ancien_montant, nouveau_montant et reste_du > 0. objet et texte renseignés seulement si moyen = email.' },\n      { k: 'CHECK', t: 'REMARQUE', d: '(locataire_id IS NULL) <> (garage_id IS NULL). resolu NULL si type ≠ probleme. date_resolution renseignée seulement si resolu = true.' }\n    ];\n    const derived = [\n      { n: 'LOCATION.statut', v: 'a_venir · active · terminee', c: 'a_venir si date_debut > date du jour. terminee si date_fin ≤ date du jour. active sinon (date_fin NULL ou future).' },\n      { n: 'GARAGE.statut_affiche', v: 'libre · loue · indisponible', c: 'loue si une location active a démarré ; sinon indisponible si GARAGE.statut = indisponible ; sinon libre. Une location à venir ne rend pas le garage loué.' },\n      { n: 'GARAGE.loyer_courant', v: 'montant ou vide', c: 'LOYER_GARAGE dont date_debut ≤ date du jour ≤ date_fin (ou date_fin NULL).' },\n      { n: 'LOYER_GARAGE.etat', v: 'a_venir · en_vigueur · cloture', c: 'a_venir si date_debut ≥ 1er du mois suivant ; en_vigueur si date_fin NULL ou ≥ date du jour ; cloture sinon.' },\n      { n: 'ECHEANCE.montant_recu', v: 'décimal', c: `SUM(VERSEMENT.montant) de l'échéance.` },\n      { n: 'ECHEANCE.reste_du', v: 'décimal ≥ 0', c: 'montant_du − montant_recu.' },\n      { n: 'ECHEANCE.statut', v: 'a_payer · partiel · paye', c: 'paye si reste_du = 0 et montant_recu > 0 ; partiel si montant_recu > 0 et reste_du > 0 ; a_payer si aucun versement.' },\n      { n: 'ECHEANCE.en_retard', v: 'booléen', c: `Vrai si l'échéance n'est pas soldée et que sa période est passée, selon le paramètre jour_limite (le mois en cours passe en retard après ce jour).` },\n      { n: 'LOCATAIRE.statut', v: 'actuel · ancien · sans_location', c: `actuel s'il a une location active ; ancien s'il a eu des locations mais aucune active ; sans_location s'il n'en a jamais eu.` },\n      { n: 'LOCATAIRE.solde', v: 'a_jour · en_retard', c: `en_retard si au moins une de ses échéances est en retard.` },\n      { n: 'AVIS.a_communiquer', v: 'liste de tâches', c: `Pour chaque garage loué, loyer à venir dont le montant diffère du précédent et sans ligne AVIS_LOYER portant le même loyer, le même montant et la même date d'effet.` },\n      { n: 'RELANCE.a_faire', v: 'liste de tâches', c: `Échéance en retard sans ligne RELANCE pour le même reste dû. Cas total ou partiel déduit des versements.` },\n      { n: 'DROIT.effectif', v: 'booléen par écran et action', c: `DROIT_PROFIL du profil de l'utilisateur ; pour un profil Locataire, résultat limité aux lignes rattachées à UTILISATEUR.locataire_id. Sur tablette et smartphone, DROIT_APPAREIL.autorise s'ajoute (présentation).` },\n      { n: 'CHRONOLOGIE.evenements', v: 'locations · paiements · remarques', c: `Événements d'un locataire agrégés depuis LOCATION (début, fin), VERSEMENT et REMARQUE (création, résolution), triés du plus récent au plus ancien.` },\n      { n: 'STATISTIQUES (4 pages)', v: 'par année', c: `Loyers encaissés : SUM(VERSEMENT.montant) par mois. Taux d'occupation : garages loués en fin de mois / total. Répartition par statut : loué, libre, indisponible à une date. Remarques par type et taux de résolution des problèmes.` }\n    ];\n    const appRules = [\n      { k: 'Garage', d: 'Maximum 20 garages au total.' },\n      { k: 'Loyer', d: `Non-chevauchement des périodes d'un garage. Un nouveau loyer clôture l'ancien (date_fin = veille). Seul le dernier loyer est modifiable ; seul un dernier loyer à venir est supprimable. Blocage si un paiement existe déjà pour la période ou si une location a démarré depuis son début.` },\n      { k: 'Location', d: `Une seule location active à la fois par garage. Garage libre exigé à la création. Un loyer doit exister à la date de début. Durée minimale : paramètre location_duree_min.` },\n      { k: 'Location', d: `Suppression (droit loc « supprimer ») : à venir toujours possible ; active seulement sans paiement ; terminée jamais.` },\n      { k: 'Clés', d: 'nb_cles_remises ≤ nb_cles_total − nb_cles_reserve, y compris lors de la modification du garage (total − réserve ≥ clés remises de la location active).' },\n      { k: 'Échéance', d: `Création manuelle par mois (garages avec location couvrant la période). Une échéance par location et par mois. Le montant dû est figé à la création. Le README liste ce point parmi les décisions ouvertes (ligne calculée à l'affichage ou échéance créée au premier versement).` },\n      { k: 'Versement', d: 'Cumul des versements ≤ montant_du. Paiement partiel strictement inférieur au reste dû ; sinon paiement en totalité. Annulation d\\'un versement réservée au droit pai « supprimer » (admin par défaut).' },\n      { k: 'Locataire', d: 'Alerte de doublon sur nom + prénom, non bloquante.' },\n      { k: 'Utilisateur', d: `Au moins un admin actif en permanence. Pas de suppression de compte, désactivation seulement. Impossible de modifier son propre profil, de désactiver son propre compte ou de réinitialiser son propre mot de passe depuis l'écran Utilisateurs. Mot de passe temporaire de 12 caractères généré par le back, affiché une seule fois.` },\n      { k: 'Droits', d: `Admin : tous les droits, non modifiables. Les écrans aud et mnt sont réservés à l'admin et ne peuvent être accordés à aucun autre profil. Les changements de droits sont enregistrés en une fois (brouillon puis « Enregistrer ») et s'appliquent à la requête suivante.` },\n      { k: 'Audit', d: `Chaque création, modification et suppression des 9 tables suivies écrit une ligne JOURNAL_AUDIT dans la même transaction. Les effets automatiques (clôture d'un loyer, suppression en cascade, remarque automatique) ont leur propre ligne, au nom de l'utilisateur déclencheur.` },\n      { k: 'Maintenance', d: `PARAMETRE maintenance_active (nature systeme) à 1 : seul l'admin peut se connecter ; les autres profils reçoivent un refus 503 (code MAINTENANCE), sans modification de leurs comptes. Changement d'état journalisé, admin seulement.` },\n      { k: 'Paramètre', d: `Modifiable par les profils ayant le droit par « modifier » (admin et gestionnaire par défaut). Les paramètres obligatoires ne peuvent pas être vides ; format e-mail contrôlé pour le type email ; bornes contrôlées pour le type entier. Aucune création ni suppression depuis l'écran : les lignes sont livrées avec l'application.` },\n      { k: 'Messages', d: `Chaque avis, relance ou message libre crée une remarque de type information sur la fiche du locataire. Avis et relances par e-mail conservent l'objet et le texte expédiés ; les moyens manuels (téléphone, courrier, oral) ne conservent que le moyen et la date.` },\n      { k: 'Suppressions', d: `Les droits de suppression sont paramétrables par profil (DROIT_PROFIL.peut_supprimer). Les conditions métier de chaque suppression restent vérifiées quel que soit le profil. Défaut de la maquette : le gestionnaire reçoit les mêmes droits que l'admin hors Configuration (point à confirmer).` }\n    ];\n    const screens = [\n      { n: 'Paramètres (par)', t: 'PARAMETRE', d: `Onglets par catégorie (expéditeur, organisation, garages et loyers, paiements, affichage, messages, sécurité). Un bouton Enregistrer par catégorie.` },\n      { n: 'Modèles de messages (tpl)', t: 'PARAMETRE', d: `Objet et texte de l'avis de loyer, de la relance « impayé total » et de la relance « paiement partiel », et signature (texte riche). Variables remplacées à l'envoi.` },\n      { n: 'Utilisateurs (usr)', t: 'UTILISATEUR, JETON_MOT_DE_PASSE, LOCATAIRE', d: `Comptes, profils, statut actif, dernière connexion, mot de passe temporaire. Le jeton sert au mot de passe oublié. Un compte Locataire est relié à sa fiche.` },\n      { n: 'Droits d\\'accès (dro)', t: 'DROIT_PROFIL, DROIT_APPAREIL', d: `Onglet « Accès aux écrans » et « Actions autorisées » : DROIT_PROFIL. Onglet « Accès selon l'appareil » (admin) : DROIT_APPAREIL.` },\n      { n: 'Journal d\\'audit (aud)', t: 'JOURNAL_AUDIT, UTILISATEUR', d: `Consultation filtrée par période, utilisateur, concept, action et recherche ; détail avant / après ; historique d'un enregistrement. Lecture seule.` },\n      { n: 'Maintenance (mnt)', t: 'PARAMETRE (maintenance_active), UTILISATEUR', d: `Interrupteur global, comptes actifs par profil. Aucun statut de compte n'est modifié.` },\n      { n: 'Avis de loyer (avi)', t: 'AVIS_LOYER, LOYER_GARAGE, LOCATION, REMARQUE', d: `Avis envoyés ou marqués comme informés (e-mail, téléphone, courrier, oral). Les avis à envoyer sont calculés.` },\n      { n: 'Relances d\\'impayés (rel)', t: 'RELANCE, ECHEANCE, REMARQUE', d: `Relances envoyées ou marquées comme faites. Les relances à faire sont calculées.` }\n    ];\n    const P = (cat, cle, type, def, req, lim) => ({ cat, cle, type, def, req: req ? 'oui' : 'non', lim });\n    const params = [\n      P('Expéditeur', 'expediteur_nom', 'texte', 'Sophie Delmotte', 1, '—'),\n      P('Expéditeur', 'expediteur_email', 'email', 'gestion@delmotte-garages.be', 1, 'Format e-mail'),\n      P('Expéditeur', 'reponse_email', 'email', '(vide)', 0, 'Format e-mail'),\n      P('Expéditeur', 'cci_email', 'email', '(vide)', 0, 'Format e-mail'),\n      P('Organisation', 'org_nom', 'texte', '(vide)', 0, '—'),\n      P('Organisation', 'org_adresse', 'texte', '(vide)', 0, '—'),\n      P('Organisation', 'org_tel', 'texte', '(vide)', 0, '—'),\n      P('Organisation', 'org_iban', 'texte', '(vide)', 0, '—'),\n      P('Garages, loyers et locations', 'garage_prefixe', 'texte', 'G', 1, '—'),\n      P('Garages, loyers et locations', 'garage_chiffres', 'entier', '2', 1, '1 à 5'),\n      P('Garages, loyers et locations', 'location_duree_min', 'entier', '1', 1, '1 à 60 mois'),\n      P('Paiements et impayés', 'jour_limite', 'entier', '31', 1, '1 à 31'),\n      P('Affichage', 'lignes_liste', 'entier', '10', 1, '5 à 50'),\n      P('Affichage', 'lignes_hist', 'entier', '5', 1, '3 à 20'),\n      P('Affichage', 'graph_mois', 'entier', '12', 1, '6 à 24'),\n      P('Affichage', 'langue_defaut', 'liste', 'fr', 1, 'fr, en'),\n      P('Affichage', 'menu_replie', 'liste', 'non', 1, 'non, oui'),\n      P('Messages', 'signature', 'texte_riche', '<p>Cordialement,<br>{expediteur}<\u002Fp>', 0, 'HTML assaini'),\n      P('Sécurité', 'inactivite_min', 'entier', '0', 1, '0 à 240 minutes (0 = désactivée)'),\n      P('Sécurité', 'mdp_min', 'entier', '8', 1, '6 à 32 caractères'),\n      P('Modèles de messages', 'modele_avis (objet, texte)', 'texte, texte_riche', 'Voir maquette', 1, 'Objet et texte obligatoires'),\n      P('Modèles de messages', 'modele_relance_total (objet, texte)', 'texte, texte_riche', 'Voir maquette', 1, 'Objet et texte obligatoires'),\n      P('Modèles de messages', 'modele_relance_partiel (objet, texte)', 'texte, texte_riche', 'Voir maquette', 1, 'Objet et texte obligatoires'),\n      P('Système (nature systeme)', 'maintenance_active', 'entier', '0', 1, '0 ou 1 · non affiché dans l\\'écran Paramètres')\n    ];\n    const changes = [\n      { k: 'UTILISATEUR', d: `Ajout de nom, prenom, mot_de_passe_temporaire, locataire_id, derniere_connexion, date_creation. role : lecture_seule devient consultant, et locataire est ajouté. UTILISATEUR a maintenant des relations (LOCATAIRE, JETON_MOT_DE_PASSE, JOURNAL_AUDIT, AVIS_LOYER, RELANCE).` },\n      { k: 'DROIT_PROFIL', d: `Nouvelle table. Droits par profil et par écran, modifiables par l'admin ; remplace les rôles figés du MCD précédent.` },\n      { k: 'DROIT_APPAREIL', d: `Nouvelle table. Écrans disponibles sur tablette et smartphone.` },\n      { k: 'JOURNAL_AUDIT', d: `Nouvelle table. Journal des créations, modifications et suppressions sur 9 tables, en insertion seule.` },\n      { k: 'JETON_MOT_DE_PASSE', d: `Nouvelle table. Réinitialisation du mot de passe par lien reçu par e-mail.` },\n      { k: 'AVIS_LOYER', d: `Nouvelle table. Mémorise les avis de changement de loyer communiqués ; les avis à envoyer restent calculés.` },\n      { k: 'RELANCE', d: `Nouvelle table. Mémorise les relances d'impayés ; les relances à faire restent calculées.` },\n      { k: 'PARAMETRE', d: `Nouvelle nature systeme (maintenance_active). Porte aussi les modèles de messages, la signature et les paramètres de sécurité et d'affichage (section 9).` },\n      { k: 'Inchangées', d: `LOCATAIRE, LOCATION, GARAGE, LOYER_GARAGE, ECHEANCE, VERSEMENT et REMARQUE ne changent pas de structure. Les règles de suppression qui disaient « admin uniquement » deviennent des droits paramétrables.` },\n      { k: 'Points ouverts', d: `Création des échéances, maximum de 20 garages, colonne adresse, clés totales ≥ 0 ou > 0, suppressions par le gestionnaire, durée de validité du jeton, règles de suppression marquées « à confirmer » : voir les décisions ouvertes du README.` }\n    ];\n    const dW = 1220, dH = Math.max(...E.map(e => e.ay + e.h)) + 16;\n    return { cards, lines, lineLabels, entities, rels, enums, sqlRules, derived, appRules, screens, params, changes, dW, dH };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
