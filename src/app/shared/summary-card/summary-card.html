<div class="card sc">
  <div class="sc__head">
    <span class="sc__avatar" [class.sc__avatar--square]="shape() === 'square'" aria-hidden="true">{{ avatar() }}</span>
    <div>
      <div class="sc__kicker">{{ kicker() }}</div>
      <div class="sc__title">{{ title() }}</div>
    </div>
  </div>
  <dl class="sc__fields">
    @for (field of fields(); track field.label) {
      <div class="sc__field">
        <dt>{{ field.label }}</dt>
        <dd>{{ field.value }}</dd>
      </div>
    }
  </dl>
</div>
