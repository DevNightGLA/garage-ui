<div class="pi">
  <input
    #field
    class="input pi__field"
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [disabled]="disabled()"
    [autocomplete]="autocomplete()"
    (input)="typed(field.value)"
    (blur)="onTouched()"
  />
  <button
    type="button"
    class="pi__eye"
    [attr.aria-pressed]="visible()"
    [appTooltip]="(visible() ? 'auth.mdp.masquer' : 'auth.mdp.afficher') | translate"
    (click)="visible.set(!visible())"
  >
    <i class="fa-solid" [class.fa-eye]="!visible()" [class.fa-eye-slash]="visible()"></i>
  </button>
</div>
