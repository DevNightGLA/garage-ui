<app-modal [title]="'remarques.resolution.titre' | translate" [width]="400" [error]="error()" (closed)="closed.emit()">
  <form id="resolution-form" class="modal-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field [label]="'remarques.resolution.date' | translate" [error]="fieldErrors()['dateResolution']">
      <app-date-input formControlName="dateResolution" />
    </app-form-field>
  </form>

  <div modalFooter>
    <button type="button" class="btn btn--secondary" (click)="closed.emit()">
      {{ 'commun.annuler' | translate }}
    </button>
    <button type="submit" form="resolution-form" class="btn btn--primary" [disabled]="pending()">
      {{ 'commun.enregistrer' | translate }}
    </button>
  </div>
</app-modal>
