@if (sent()) {
  <app-auth-card [title]="'auth.oubli.envoyeTitre' | translate" [subtitle]="'auth.oubli.envoye' | translate">
    <a class="link-muted link-muted--center" routerLink="/connexion">{{ 'auth.oubli.retour' | translate }}</a>
  </app-auth-card>
} @else {
  <app-auth-card [title]="'auth.oubli.titre' | translate" [subtitle]="'auth.oubli.aide' | translate">
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field
        [label]="'auth.oubli.email' | translate"
        [requiredMark]="false"
        [error]="fieldErrors()['email']"
      >
        <input class="input" type="email" formControlName="email" autocomplete="email" />
      </app-form-field>

      @if (error(); as message) {
        <div class="message-error" role="alert">{{ message }}</div>
      }

      <button type="submit" class="btn btn--primary" [disabled]="pending()">
        {{ 'auth.oubli.envoyer' | translate }}
      </button>
      <a class="link-muted link-muted--center" routerLink="/connexion">{{ 'auth.oubli.retour' | translate }}</a>
    </form>
  </app-auth-card>
}
