<app-auth-card [title]="'auth.temporaire.titre' | translate" [subtitle]="'auth.temporaire.aide' | translate">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field [label]="'auth.temporaire.actuel' | translate" [error]="fieldErrors()['motDePasseActuel']">
      <app-password-input formControlName="actuel" autocomplete="current-password" />
    </app-form-field>

    <app-form-field
      [label]="'auth.mdp.nouveau' | translate"
      [hint]="'auth.mdp.minimum' | translate: { n: settings.mdpMin() }"
      [error]="fieldErrors()['nouveauMotDePasse']"
    >
      <app-password-input formControlName="nouveau" autocomplete="new-password" />
    </app-form-field>

    <app-form-field [label]="'auth.mdp.confirmer' | translate" [error]="mismatch()">
      <app-password-input formControlName="confirmer" autocomplete="new-password" />
    </app-form-field>

    @if (error(); as message) {
      <div class="message-error" role="alert">{{ message }}</div>
    }

    <button type="submit" class="btn btn--primary" [disabled]="pending()">
      {{ (pending() ? 'commun.enregistrement' : 'commun.enregistrer') | translate }}
    </button>
    <button type="button" class="link-muted link-muted--center" (click)="logout()">
      {{ 'auth.deconnexion.bouton' | translate }}
    </button>
  </form>
</app-auth-card>
