<app-modal [title]="'auth.mdp.titre' | translate" [width]="420" [error]="error()" (closed)="closed.emit()">
  <form id="change-password-form" class="modal-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field [label]="'auth.mdp.actuel' | translate" [error]="fieldErrors()['motDePasseActuel']">
      <app-password-input formControlName="actuel" autocomplete="current-password" />
    </app-form-field>
    <app-form-field [label]="'auth.mdp.nouveau' | translate" [error]="fieldErrors()['nouveauMotDePasse']">
      <app-password-input formControlName="nouveau" autocomplete="new-password" />
    </app-form-field>
    <app-form-field [label]="'auth.mdp.confirmer' | translate" [error]="mismatch()">
      <app-password-input formControlName="confirmer" autocomplete="new-password" />
    </app-form-field>
  </form>

  <div modalFooter>
    <button type="button" class="btn btn--secondary btn--wide" (click)="closed.emit()">
      {{ 'commun.annuler' | translate }}
    </button>
    <button type="submit" form="change-password-form" class="btn btn--primary btn--wide" [disabled]="pending()">
      {{ 'commun.enregistrer' | translate }}
    </button>
  </div>
</app-modal>
