<app-auth-card [title]="'auth.reinit.titre' | translate" [subtitle]="(token ? 'auth.reinit.aide' : 'auth.reinit.lienManquant') | translate">
  @if (token) {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field [label]="'auth.mdp.nouveau' | translate" [error]="fieldErrors()['nouveauMotDePasse']">
        <app-password-input formControlName="nouveau" autocomplete="new-password" />
      </app-form-field>

      <app-form-field [label]="'auth.mdp.confirmer' | translate" [error]="mismatch()">
        <app-password-input formControlName="confirmer" autocomplete="new-password" />
      </app-form-field>

      @if (error(); as message) {
        <div class="message-error" role="alert">{{ message }}</div>
      }

      <button type="submit" class="btn btn--primary" [disabled]="pending()">
        {{ 'commun.enregistrer' | translate }}
      </button>
      <a class="link-muted link-muted--center" routerLink="/connexion">{{ 'auth.oubli.retour' | translate }}</a>
    </form>
  } @else {
    <a class="link-muted link-muted--center" routerLink="/connexion">{{ 'auth.oubli.retour' | translate }}</a>
  }
</app-auth-card>
