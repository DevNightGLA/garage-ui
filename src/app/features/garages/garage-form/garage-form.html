<app-modal
  [title]="titleKey() | translate: { numero: garage()?.numero }"
  [width]="480"
  [error]="error()"
  (closed)="closed.emit()"
>
  <form id="garage-form" class="modal-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field [label]="'garages.form.numero' | translate" [error]="fieldErrors()['numero']">
      <input class="input" formControlName="numero" autocomplete="off" />
    </app-form-field>

    <div class="form-row">
      <app-form-field [label]="'garages.form.cles' | translate" [error]="fieldErrors()['nbClesTotal']">
        <input class="input" type="number" [attr.min]="0" step="1" formControlName="nbClesTotal" />
      </app-form-field>
      <app-form-field [label]="'garages.form.reserve' | translate" [error]="fieldErrors()['nbClesReserve']">
        <input class="input" type="number" [attr.min]="0" step="1" formControlName="nbClesReserve" />
      </app-form-field>
    </div>

    <app-form-field [label]="'garages.form.statut' | translate" [error]="fieldErrors()['statutModifiable']">
      @if (isRented) {
        <select class="input" disabled>
          <option>{{ 'garages.statut.LOUE' | translate }}</option>
        </select>
      } @else {
        <select class="input" formControlName="statutModifiable">
          <option value="LIBRE">{{ 'garages.statut.LIBRE' | translate }}</option>
          <option value="INDISPONIBLE">{{ 'garages.statut.INDISPONIBLE' | translate }}</option>
        </select>
      }
    </app-form-field>

    @if (isCreation) {
      <div class="form-row">
        <app-form-field [label]="'garages.form.loyer' | translate" [error]="fieldErrors()['loyerMontant']">
          <input class="input" type="number" [attr.min]="0" step="0.01" formControlName="loyerMontant" />
        </app-form-field>
        <app-form-field [label]="'garages.form.debutLoyer' | translate" [error]="fieldErrors()['loyerDateDebut']">
          <app-date-input formControlName="loyerDateDebut" />
        </app-form-field>
      </div>
    }

    <div class="message-info">
      <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
      <span>{{ (isCreation ? 'garages.form.aideCreation' : 'garages.form.aideModification') | translate }}</span>
    </div>
  </form>

  <div modalFooter>
    <button type="button" class="btn btn--secondary" (click)="closed.emit()">
      {{ 'commun.annuler' | translate }}
    </button>
    @if (!readOnly()) {
      <button type="submit" form="garage-form" class="btn btn--primary" [disabled]="pending()">
        {{ 'commun.enregistrer' | translate }}
      </button>
    }
  </div>
</app-modal>
